# Self-hosted, S3-compatible object storage (MinIO) on the same VM — a $0
# alternative to managed R2/S3 for the photo-upload path. Layer it on top of the
# base stack and the Caddy overlay:
#
#   docker compose -f docker-compose.prod.yml \
#     -f deploy/docker-compose.caddy.yml \
#     -f deploy/docker-compose.minio.yml up -d
#
# How it is reached: MinIO is NOT published to the internet. Caddy routes only
# requests under the bucket path (/<S3_BUCKET>/*) on the existing API host to
# minio:9000 (see deploy/Caddyfile), so no second hostname or certificate is
# needed. Point storage at that same host, path-style:
#
#   S3_ENDPOINT=https://<API_DOMAIN>
#   S3_BUCKET=kitchen-photos           # must match the Caddyfile @storage path
#   S3_REGION=us-east-1                 # MinIO's SigV4 scope — NOT R2's "auto"
#   S3_FORCE_PATH_STYLE=true
#   S3_ACCESS_KEY / S3_SECRET_KEY       # become the MinIO root credentials
#
# Because storage is publicly routable, the API hands the vision provider a
# presigned GET URL it fetches directly; the API itself only signs URLs and
# never streams object bytes.

services:
  minio:
    image: minio/minio:latest
    container_name: kitchen-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      # Must equal S3_REGION so the client's SigV4 credential scope validates.
      MINIO_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - minio-data:/data
    # No `ports:` — reached privately as minio:9000 via Caddy only.

  # One-shot: wait for MinIO, then create the bucket (idempotent).
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-kitchen-photos}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\"; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/\"$$S3_BUCKET\";
      echo 'bucket ready: '\"$$S3_BUCKET\";
      "
    restart: 'no'

volumes:
  minio-data:
